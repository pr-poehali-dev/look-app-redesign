<!DOCTYPE html>
<html><body>
<div id="log" style="font-family:monospace;white-space:pre-wrap;font-size:11px;"></div>
<script type="module">
const log = (msg) => { document.getElementById('log').innerText += msg + '\n'; };
window.onerror = (msg) => log('WINDOW ERROR: ' + msg);
window.onunhandledrejection = (e) => log('UNHANDLED REJECTION: ' + (e.reason?.message || e.reason));
try {
  const mod = await import('/src/_whisperDebug2.ts');
  await mod.runDebug(log);
} catch (e) {
  log('CAUGHT ERROR: ' + e.message);
  log('STACK: ' + e.stack);
}
</script>
</body></html>
