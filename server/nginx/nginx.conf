user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 50M;
  proxy_read_timeout 86400;
  proxy_send_timeout 86400;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ---------- signal.look.com.ru ----------
  server {
    listen 80;
    server_name signal.look.com.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl http2;
    server_name signal.look.com.ru;
    ssl_certificate     /etc/letsencrypt/live/signal.look.com.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signal.look.com.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://signaling:4000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ---------- sfu.look.com.ru ----------
  server {
    listen 80;
    server_name sfu.look.com.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl http2;
    server_name sfu.look.com.ru;
    ssl_certificate     /etc/letsencrypt/live/sfu.look.com.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sfu.look.com.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://sfu:4001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
