version: '3.8'

services:
  signaling:
    build: ./signaling
    container_name: look-signaling
    restart: always
    environment:
      PORT: 4000
      AUTH_VERIFY_URL: ${AUTH_VERIFY_URL}
      SFU_URL: https://sfu.look.com.ru
    networks:
      - look
    expose:
      - "4000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  sfu:
    build: ./sfu
    container_name: look-sfu
    restart: always
    network_mode: host
    environment:
      PORT: 4001
      ANNOUNCED_IP: 155.212.128.190
      RTC_MIN_PORT: 40000
      RTC_MAX_PORT: 40200
      AUTH_VERIFY_URL: ${AUTH_VERIFY_URL}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  coturn:
    image: coturn/coturn:latest
    container_name: look-coturn
    restart: always
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: look-nginx
    restart: always
    depends_on:
      - signaling
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - look
    extra_hosts:
      - "sfu:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    container_name: look-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"

  watchtower:
    image: containrrr/watchtower
    container_name: look-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --interval 86400

networks:
  look:
    driver: bridge
